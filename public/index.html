<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover でノッチ下まで背景を敷き、user-scalable=no で二本指ズームを封じる -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- ▼ アプリ名を変えるときはこの3箇所 + manifest.webmanifest -->
    <title>Number in mind</title>
    <meta name="apple-mobile-web-app-title" content="Number in mind" />
    <meta name="application-name" content="Number in mind" />

    <!-- ホーム画面から起動したときにアドレスバーを消して全画面にする -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070F" />

    <!-- 手品の道具なので検索には出さない -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.png" />

    <style>
      /* 読み込み中も黒。白い一瞬のフラッシュを出さない */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #05070f;
        overscroll-behavior: none;
      }

      /* 連打しても文字が選択されない・虫めがねが出ない・青くハイライトされない。
         実物のカードらしさを壊す要素をここで全部つぶしている */
      * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* ノッチとホームインジケータを避ける */
      #root {
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background-color: #05070f;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #root > div {
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This page requires JavaScript. / このページは JavaScript が必要です。</noscript>
  </body>
</html>
